name: Repository hygiene
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hygiene:
    name: Tier2 local artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated locked validators without lifecycle hooks
        run: npm ci --prefix tools/validation --ignore-scripts --no-audit --no-fund
      - name: Validate schema, factual assertions, navigation and workflows
        run: node tools/validate.mjs
      - name: Check Tier2 file and section presence without changing files
        run: node tools/validation/node_modules/repolinter/bin/repolinter.js lint . --dryRun
